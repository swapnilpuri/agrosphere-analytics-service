name: Analytics validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify -Pintegration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_contract_pins.py --jar target/agrosphere-analytics-service-0.1.0.jar
      - run: python -m unittest discover -s scripts -p test_contract_pins.py -v
