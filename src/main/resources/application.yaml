spring:
  application:
    name: agrosphere-analytics-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    user: ${DB_MIGRATION_USER:${DB_USER}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
server:
  port: ${SERVER_PORT:8085}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 0.1

analytics:
  environment:
    enabled: ${ANALYTICS_ENVIRONMENT_ENABLED:false}
  demo:
    enabled: ${ANALYTICS_DEMO_ENABLED:false}
  security:
    audience: ${OIDC_AUDIENCE:agrosphere-api}
